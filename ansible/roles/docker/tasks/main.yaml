---
- name: Dodanie klucza GPG repozytorium Dockera
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/trusted.gpg.d/docker.asc
    mode: "0644"

- name: Dodanie oficjalnego repozytorium Dockera
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/trusted.gpg.d/docker.asc] https://download.docker.com/linux/ubuntu jammy stable"
    state: present

- name: Instalacja Dockera i Compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
      - python3-docker
    state: present
    update_cache: true

- name: Dodanie uzytkownika group8 do grupy docker
  ansible.builtin.user:
    name: group8
    groups: docker
    append: true
