---
- name: Instalacja Nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Konfiguracja statystyk Nginx dla Zabbixa
  ansible.builtin.copy:
    dest: /etc/nginx/conf.d/status.conf
    mode: "0644"
    content: |
      server {
          listen 80;
          server_name localhost;
          location /basic_status {
              stub_status;
              allow 127.0.0.1;
              deny all;
          }
      }
  notify: Restart nginx service

- name: Upewnienie sie, ze Nginx jest wlaczony
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
