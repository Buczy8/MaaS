[defaults]
# Domyslny plik inventory generowany przez Terraform.
inventory = inventory.ini
# Lokalizacja rol wykorzystywanych przez playbook.
roles_path = roles
# Wylacza interaktywne pytania o klucz hosta przy pierwszym polaczeniu.
host_key_checking = False
# Nie tworzy plikow *.retry po niepowodzeniu uruchomienia.
retry_files_enabled = False
# Automatyczny dobor interpretera Python po stronie hosta.
interpreter_python = auto_silent
# Katalog tymczasowy na hostach zarzadzanych.
remote_tmp = /tmp

[ssh_connection]
# Zmniejsza liczbe round-trip SSH i przyspiesza wykonywanie taskow.
pipelining = True
